services:
  web:
    image: nginx:latest

    volumes:
      - ./website:/usr/share/nginx/html

    expose:
      - "80"

    networks:
      - internal

    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/nginx/html/index.html"]
      interval: 30s
      timeout: 10s
      retries: 3

  cache:
    image: varnish:stable

    ports:
      - "8080:80"

    volumes:
      - ./varnish/default.vcl:/etc/varnish/default.vcl

    depends_on:
      - web

    command: >
      varnishd
      -F
      -f /etc/varnish/default.vcl
      -a :80

    networks:
      - internal

networks:
  internal: